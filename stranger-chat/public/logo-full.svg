<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 180" width="580" height="180">
  <defs>
    <linearGradient id="fullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <linearGradient id="swooshLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#B026FF" />
      <stop offset="100%" stop-color="#FF1E56" />
    </linearGradient>
  </defs>

  <!-- Scaled Down Main Icon on Left -->
  <g transform="translate(10, -5) scale(0.85)">
    <path d="M45 55 H105 A22 22 0 0 1 127 77 V102 A22 22 0 0 1 105 124 H67 L45 142 V77 A22 22 0 0 1 45 55 Z" fill="url(#fullGrad)" />
    <path d="M95 82 H145 A20 20 0 0 1 165 102 V122 A20 20 0 0 1 145 142 H135 L150 156 V142 H95 A20 20 0 0 1 75 122 V102 A20 20 0 0 1 95 82 Z" fill="#FFFFFF" opacity="0.95" />
    <circle cx="105" cy="112" r="5" fill="#00D2FF" />
    <circle cx="122" cy="112" r="5" fill="#9D00FF" />
    <circle cx="139" cy="112" r="5" fill="#FF007F" />
    <path d="M40 168 Q100 150 160 168 Q100 158 40 168 Z" fill="url(#fullGrad)" />
  </g>

  <!-- Brand Name: Chattr -->
  <text x="160" y="95" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="76" font-weight="800" font-style="italic" letter-spacing="-1">
    <tspan fill="#FFFFFF">Chat</tspan><tspan fill="url(#fullGrad)">tr</tspan>
  </text>

  <!-- Bottom Curved Line -->
  <path d="M160 118 Q340 102 520 118 Q340 109 160 118 Z" fill="url(#swooshLine)" />

  <!-- Tagline: Meet • Chat • Connect -->
  <g font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="16" font-weight="500" fill="#A0A8C0">
    <text x="210" y="145">Meet</text>
    <circle cx="265" cy="139" r="3" fill="#9D00FF" />
    <text x="280" y="145">Chat</text>
    <circle cx="330" cy="139" r="3" fill="#FF007F" />
    <text x="345" y="145">Connect</text>
  </g>
</svg>